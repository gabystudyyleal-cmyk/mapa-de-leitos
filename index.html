<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mapa de Leitos</title>
</head>

<body>
    <main class="container">
        <form>

            <div class="card">
                <h1>Cadastro de Funcionário</h1>
                <div class="formulario">

                    <div class="campo">
                        <label>Nome Completo</label>
                        <input type="text">
                    </div>
                    <div class="campo">
                        <label>CPF</label>
                        <input type="text">
                    </div>
                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email">
                    </div>
                    <div class="campo">
                        <label>Telefone</label>
                        <input type="text">
                    </div>
                    <div class="campo">
                        <label>Cargo</label>
                        <input type="text">
                    </div>
                    <div class="campo">
                        <label>Setor</label>
                        <input type="text">
                    </div>

                    <div class="campo">
                        <label>Coren/CRM</label>
                        <input type="text">
                    </div>
                    <div class="campo">
                        <label>Data de Nascimento </label>
                        <input type="date">
                    </div>
                </div>
                <div class="botao">
                    <button>Cadastrar</button>
                </div>

            </div>
        </form>
    </main>
</body>

</html>
